name: publish-npm

# Publishes the dsh bundle (aegisharness/) to npm.
#
# Two auth modes, picked automatically at runtime:
#
#   OIDC trusted publishing (preferred, no secret)
#     npm proves this exact workflow's identity to the registry with a
#     short-lived OIDC token. Needs npm CLI >= 11.5.1, a GitHub-hosted runner,
#     and a trusted publisher configured on the package's npm settings page.
#
#   NPM_TOKEN (bootstrap fallback)
#     Used while the package does not exist on npm yet -- a trusted publisher
#     can only be configured for an existing package -- or if you prefer a token.
#     Token must be a Granular token with "Bypass two-factor authentication"
#     enabled, otherwise the publish fails with EOTP in CI.
#
# Triggers
#   - push a tag like v1.0.0 -> publishes aegisharness/package.json's version
#   - manual run             -> uses the `version` input, must match package.json
#
# Do NOT set `registry-url` on setup-node: it writes an .npmrc containing an
# empty _authToken, and that empty credential blocks OIDC publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v); must equal aegisharness/package.json"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegisharness
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Prepare npm CLI
        run: |
          set -euo pipefail
          echo "npm before: $(npm --version)"
          # Trusted publishing needs npm >= 11.5.1; harmless in token mode too.
          npm install -g 'npm@^11.5.1' >/dev/null
          echo "npm after:  $(npm --version)"

      - name: Resolve expected version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected="${INPUT_VERSION#v}"
          else
            expected="${REF_NAME#v}"
          fi
          actual="$(node -p "require('./package.json').version")"
          echo "tag/input=$expected package.json=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::version mismatch: trigger says '$expected' but aegisharness/package.json says '$actual'. Bump the version first."
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Choose auth mode
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            # Keep the secret out of the file: npm expands ${NODE_AUTH_TOKEN}.
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"
            chmod 600 "$HOME/.npmrc"
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "auth mode: NPM_TOKEN (bootstrap). Remember to delete the secret once OIDC works."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "auth mode: OIDC trusted publishing."
          fi

      - name: Offline bundle self-check
        run: node tests/dsh-plugin.test.mjs

      - name: Release consistency check
        run: python3 scripts/check_release.py

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.auth.outputs.mode }}" = "oidc" ]; then
            unset NODE_AUTH_TOKEN
          fi
          npm publish --access public --provenance
          echo "published @eliterncn/aegisharness-dsh@${{ steps.version.outputs.version }} via ${{ steps.auth.outputs.mode }}"

      - name: Verify it is installable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Registry metadata can lag a few seconds behind a fresh publish.
          for attempt in 1 2 3 4 5; do
            if npm view "@eliterncn/aegisharness-dsh@${version}" version --registry https://registry.npmjs.org; then
              exit 0
            fi
            echo "registry not serving ${version} yet (attempt ${attempt}); retrying in 5s"
            sleep 5
          done
          echo "::error::published, but npm view still cannot resolve ${version}"
          exit 1

      - name: Summary
        if: always()
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          {
            echo "### publish-npm"
            echo ""
            echo "- package: \`@eliterncn/aegisharness-dsh@${VERSION}\`"
            echo "- trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- auth: \`${AUTH_MODE:-unknown}\`"
            echo "- install with: \`dsh plugin --profile web add @eliterncn/aegisharness-dsh\`"
          } >> "$GITHUB_STEP_SUMMARY"
