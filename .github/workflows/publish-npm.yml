name: publish-npm

# Publishes the dsh bundle (aegisharness/) to npm.
#
# Triggers
#   - push a tag like v1.0.0 -> publishes aegisharness/package.json's version
#   - manual run           -> uses the `version` input, must match package.json
#
# Required repository secret: NPM_TOKEN (an npm Automation/Granular token with
# read+write on the @elierncn scope). Without it the job fails fast.
#
# Provenance is enabled, so the npm page links the published tarball back to
# this exact commit: that needs `id-token: write` below and a public repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v); must equal aegisharness/package.json"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegisharness
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve expected version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected="${INPUT_VERSION#v}"
          else
            expected="${REF_NAME#v}"
          fi
          actual="$(node -p "require('./package.json').version")"
          echo "tag/input=$expected package.json=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::version mismatch: trigger says '$expected' but aegisharness/package.json says '$actual'. Bump the version first."
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::secret NPM_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "NPM_TOKEN present (length ${#NODE_AUTH_TOKEN})"

      - name: Offline bundle self-check
        run: node tests/dsh-plugin.test.mjs

      - name: Release consistency check
        run: python3 scripts/check_release.py

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance
          echo "published @elierncn/aegisharness-dsh@${{ steps.version.outputs.version }}"

      - name: Verify it is installable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Registry metadata can lag a few seconds behind a fresh publish.
          for attempt in 1 2 3 4 5; do
            if npm view "@elierncn/aegisharness-dsh@${version}" version --registry https://registry.npmjs.org; then
              exit 0
            fi
            echo "registry not serving ${version} yet (attempt ${attempt}); retrying in 5s"
            sleep 5
          done
          echo "::error::published, but npm view still cannot resolve ${version}"
          exit 1

      - name: Summary
        if: always()
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### publish-npm"
            echo ""
            echo "- package: \`@elierncn/aegisharness-dsh@${VERSION}\`"
            echo "- trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- install with: \`dsh plugin --profile web add @elierncn/aegisharness-dsh\`"
          } >> "$GITHUB_STEP_SUMMARY"
